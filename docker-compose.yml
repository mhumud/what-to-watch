version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: streamrecs-db
    environment:
      POSTGRES_USER: streamuser
      POSTGRES_PASSWORD: streampass
      POSTGRES_DB: streamdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamuser"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
